spring:
  application:
    name: taskmesh-worker

server:
  port: ${SERVER_PORT:8081}

taskmesh:
  worker:
    enabled: ${WORKER_ENABLED:true}
    # Never hardcoded in code: Docker Compose and Kubernetes both set this.
    control-plane-url: ${CONTROL_PLANE_URL:http://localhost:8080}
    # Blank by default: WorkerIdentity derives an id from the hostname.
    # Kubernetes will supply the pod name here (Day 6).
    id: ${WORKER_ID:}
    capacity: ${WORKER_CAPACITY:2}
    poll-interval-ms: ${WORKER_POLL_INTERVAL_MS:1000}
    heartbeat-interval-ms: ${WORKER_HEARTBEAT_INTERVAL_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.taskmesh: INFO

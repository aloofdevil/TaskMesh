name: taskmesh

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-taskmesh}
      POSTGRES_USER: ${DB_USER:-taskmesh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskmesh}
    ports:
      - "5432:5432"
    volumes:
      - taskmesh-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskmesh} -d ${DB_NAME:-taskmesh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node KRaft broker (no ZooKeeper) - sufficient for local dev and
  # the load test. Not a production topology; see docs/architecture.md.
  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: LVOJVaCbTa6AxJHT_fOW8g
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  control-plane:
    build:
      context: .
      dockerfile: docker/Dockerfile.control-plane
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-taskmesh}
      DB_USER: ${DB_USER:-taskmesh}
      DB_PASSWORD: ${DB_PASSWORD:-taskmesh}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # Pass-through for the Day 11 connection-pool experiment. This is a
      # stock Spring Boot property, not a new setting: leaving it unset
      # preserves HikariCP's own default of 10, which is what every run
      # before Day 11 used. Exposed here only so the same image can be
      # measured at several pool sizes without rebuilding it.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-10}
      # Pass-through for the Day 15 outbox-publisher concurrency experiment.
      # The application.yml placeholder is resolved inside the container, so
      # without this line the variable set on the host never reaches it.
      # 1 is the application default, so leaving it unset changes nothing.
      OUTBOX_PUBLISHER_CONCURRENCY: ${OUTBOX_PUBLISHER_CONCURRENCY:-1}
      # Pass-through for the Day 16 partition investigation; 3 is the value
      # the topics have always been created with.
      OUTBOX_TOPIC_PARTITIONS: ${OUTBOX_TOPIC_PARTITIONS:-3}
      # Pass-through for the Day 18 poll-interval experiment. 500 is the
      # application default, so leaving it unset changes nothing.
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-500}
      # Pass-through for the Day 20 async-send experiment. false is the
      # application default, so leaving it unset preserves the original
      # sequential send/wait behaviour.
      OUTBOX_ASYNC_SENDS: ${OUTBOX_ASYNC_SENDS:-false}
      # Pass-through for the Day 23 key-aware sharding prototype. false is the
      # application default, so leaving it unset changes nothing.
      OUTBOX_KEY_AWARE_SHARDING: ${OUTBOX_KEY_AWARE_SHARDING:-false}
      # Pass-through for the Day 13 CPU profiling run. The default below is
      # byte-for-byte the value baked into docker/Dockerfile.control-plane,
      # so leaving it unset changes nothing; it exists so a Flight Recorder
      # recording can be attached without rebuilding the image or editing
      # application code.
      JAVA_OPTS: ${CP_JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -Dnetworkaddress.cache.ttl=10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Readiness, so dependants wait until the API can actually serve.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 45s
    stop_grace_period: 30s

  # Part of the default stack. Scale with:
  #   docker compose up -d --scale worker=3
  # Each replica derives its own worker id from its container hostname, so
  # they register separately and compete for jobs through the control plane.
  # To drive the API by hand without workers consuming the jobs, stop them:
  #   docker compose stop worker
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    environment:
      # Service name, never localhost: the control plane is a different
      # container.
      CONTROL_PLANE_URL: http://control-plane:8080
      WORKER_CAPACITY: 2
      WORKER_POLL_INTERVAL_MS: 1000
      WORKER_HEARTBEAT_INTERVAL_MS: 5000
      WORKER_LEASE_RENEW_INTERVAL_MS: 10000
      # Overridable so a demo can hold a job long enough to kill the worker
      # mid-execution and watch the lease expire.
      WORKER_JOB_DURATION_MS: ${WORKER_JOB_DURATION_MS:-2000}
      WORKER_SHUTDOWN_DRAIN_MS: ${WORKER_SHUTDOWN_DRAIN_MS:-20000}
    # No published port: replicas would collide on it, and nothing needs to
    # reach a worker - workers only make outbound calls.
    depends_on:
      control-plane:
        condition: service_healthy
    # Long enough for the 20s drain plus deregistration before Docker kills it.
    stop_grace_period: 40s

volumes:
  taskmesh-postgres-data:

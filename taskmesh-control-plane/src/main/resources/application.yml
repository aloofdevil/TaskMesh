spring:
  application:
    name: taskmesh-control-plane

  task:
    scheduling:
      pool:
        # Two scheduled tasks run here: the lease reaper and the outbox
        # publisher. Spring's default pool of 1 would make them share a
        # thread, and the publisher blocks for up to
        # taskmesh.outbox.send-timeout-ms waiting on Kafka - so a Kafka
        # outage would delay lease recovery, which is the one thing that
        # must keep running when other things are failing. Separate threads,
        # plus one spare.
        size: ${SCHEDULER_POOL_SIZE:3}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskmesh}
    username: ${DB_USER:taskmesh}
    password: ${DB_PASSWORD:taskmesh}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates the mapping matches it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          # Bind Instant as OffsetDateTime rather than as java.sql.Timestamp
          # plus a UTC Calendar.
          #
          # Both write the same absolute instant to a TIMESTAMPTZ column, but
          # the Calendar path calls java.util.TimeZone.getTimeZone(String) on
          # every bind and every extract, and that method is *static
          # synchronized* in the JDK. Under load every request thread
          # serialises on one JVM-wide lock: Day 13 profiling attributed 70%
          # of all monitor-enter events to it, with 97.7% of the blocking on
          # HTTP request threads.
          #
          # TimestampSemanticsContract pins both bindings against the values
          # PostgreSQL actually stores, so this cannot silently change what a
          # timestamp means.
          preferred_instant_jdbc_type: TIMESTAMP_WITH_TIMEZONE

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Lettuce defaults to a 60s command timeout. Redis here is only a
      # liveness cache, and WorkerLivenessCache already treats every failure
      # as non-fatal - but without these, an unreachable Redis makes each
      # call *block* for a minute before that handling runs, which turns a
      # cache outage into request threads piling up and workers timing out.
      # Failing fast is what actually makes the degradation graceful.
      timeout: ${REDIS_TIMEOUT:1s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        # Fail fast when no broker is reachable. The default (60s) would
        # stall the outbox publisher thread for a minute per attempt during
        # an outage; the events are durable in PostgreSQL either way, so
        # giving up quickly and retrying on the next poll is better.
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 4000

taskmesh:
  retry:
    # 1s, then 2s, then 4s ... doubling per consumed attempt, capped.
    initial-backoff: ${RETRY_INITIAL_BACKOFF:1s}
    max-backoff: ${RETRY_MAX_BACKOFF:60s}

  outbox:
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    send-timeout-ms: ${OUTBOX_SEND_TIMEOUT_MS:5000}
    job-events-topic: ${JOB_EVENTS_TOPIC:taskmesh.job-events}
    worker-events-topic: ${WORKER_EVENTS_TOPIC:taskmesh.worker-events}

  reliability:
    # 30s lease against the worker's 10s renewal interval: three chances to
    # renew before a job is considered abandoned.
    lease-duration-seconds: ${LEASE_DURATION_SECONDS:30}
    reaper-enabled: ${REAPER_ENABLED:true}
    reaper-interval-ms: ${REAPER_INTERVAL_MS:1000}
    reaper-batch-size: ${REAPER_BATCH_SIZE:100}

server:
  port: ${SERVER_PORT:8080}
  # Let in-flight HTTP requests finish before the JVM exits, so a rolling
  # restart does not drop a worker's completion report mid-flight.
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        # Deliberately not "*": only what probes and local inspection need.
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        # Liveness answers "should Kubernetes restart this process?" - only
        # a broken JVM should. A dependency being unreachable must never
        # restart the control plane, or an outage in Redis or Kafka would
        # turn into a restart loop that makes things worse.
        liveness:
          include: livenessState
        # Readiness answers "should this instance receive traffic?" - which
        # here means the authoritative store. PostgreSQL is the only
        # dependency the API genuinely cannot serve without. Redis is a
        # liveness cache and Kafka is fed asynchronously through the outbox,
        # so neither is included: the control plane keeps accepting and
        # running jobs through an outage of either.
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: true

logging:
  level:
    com.taskmesh: INFO
